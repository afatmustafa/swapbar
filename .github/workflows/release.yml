name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true
      tag:
        description: Existing version tag, e.g. v0.2.0 (leave empty for a dry run of the selected branch)
        type: string
        default: ''

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve version and check it matches the tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$EVENT" == "push" ]]; then
            tag="$REF_NAME"; dry_run=false
          else
            tag="$INPUT_TAG"; dry_run="$INPUT_DRY_RUN"
          fi
          if [[ -n "$tag" && "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          if [[ "$dry_run" == "false" && -z "$tag" ]]; then
            echo "::error::Publishing needs a tag; set one or enable dry_run"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "Swapbar $version, tag '${tag:-<none>}', dry run: $dry_run"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable
          rustc --version

      # Signing and notarization are optional. Without these secrets the release ships ad-hoc signed.
      #   MACOS_SIGNING_P12           base64 Developer ID Application certificate (.p12)
      #   MACOS_SIGNING_P12_PASSWORD  its password
      #   ASC_PRIVATE_KEY_P8          App Store Connect API key (.p8 contents), for notarization
      #   ASC_KEY_ID / ASC_ISSUER_ID  that key's ID and issuer
      - name: Import Developer ID into an ephemeral keychain
        id: signing
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_SIGNING_P12" ]]; then
            echo "No signing certificate configured; building ad-hoc signed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_pw=$(openssl rand -hex 24)
          security list-keychains -d user | tr -d ' "' > "$RUNNER_TEMP/original-keychains"
          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain" >/dev/null
          original=(); while IFS= read -r k; do [[ -z "$k" ]] || original+=("$k"); done < "$RUNNER_TEMP/original-keychains"
          security list-keychains -d user -s "$keychain" "${original[@]}"
          rm -f "$RUNNER_TEMP/signing.p12"

          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [[ -n "$identity" ]] || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing as: $identity"

          if [[ -n "$ASC_PRIVATE_KEY_P8" ]]; then
            printf '%s' "$ASC_PRIVATE_KEY_P8" > "$RUNNER_TEMP/asc.p8"
            xcrun notarytool store-credentials swapbar-ci \
              --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
              --keychain "$keychain" >/dev/null
            rm -f "$RUNNER_TEMP/asc.p8"
            echo "NOTARY_PROFILE=swapbar-ci" >> "$GITHUB_ENV"
            echo "Notarization enabled."
          else
            echo "::warning::Signing without notarization (ASC_PRIVATE_KEY_P8 not set)"
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build universal app and DMG
        run: |
          ./scripts/bundle.sh --universal
          ./scripts/dmg.sh

      - name: Verify
        run: |
          set -euo pipefail
          mnt=$(mktemp -d)
          hdiutil attach target/Swapbar.dmg -nobrowse -readonly -mountpoint "$mnt" >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT
          app="$mnt/Swapbar.app"
          archs=$(lipo -archs "$app/Contents/MacOS/swapbar")
          echo "archs: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Identifier|Authority|Signature|TeamIdentifier' || true
          plist_version=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          [[ "$plist_version" == "${{ steps.version.outputs.version }}" ]]
          if [[ -n "${NOTARY_PROFILE:-}" ]]; then
            # Both ask Apple's ticket service, which drops connections now and then.
            retry() {
              for attempt in 1 2 3 4 5; do
                "$@" && return 0
                echo "::warning::'$*' failed (attempt $attempt), retrying in $((attempt * 10))s"
                sleep $((attempt * 10))
              done
              return 1
            }
            retry xcrun stapler validate target/Swapbar.dmg
            retry spctl --assess --type open --context context:primary-signature -v target/Swapbar.dmg
          fi
          cat target/Swapbar.dmg.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            target/Swapbar.dmg
            target/Swapbar.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing credentials
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/original-keychains" ]]; then
            original=(); while IFS= read -r k; do [[ -z "$k" ]] || original+=("$k"); done < "$RUNNER_TEMP/original-keychains"
            security list-keychains -d user -s "${original[@]}"
          fi
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/asc.p8"

  # After the macOS build, which has checked the tag against Cargo.toml.
  build-windows:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Build and package
        run: ./scripts/package-windows.ps1

      - name: Verify
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $info = (Get-Item target\windows-package\Swapbar.exe).VersionInfo
          "$($info.FileDescription) $($info.ProductVersion)"
          if ($info.ProductVersion -ne $env:VERSION) { throw "exe version $($info.ProductVersion), expected $env:VERSION" }
          Get-Content target\Swapbar-windows-x64.zip.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ needs.build.outputs.version }}
          path: |
            target/Swapbar-windows-x64.zip
            target/Swapbar-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, build-windows]
    if: needs.build.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          {
            if [[ "$SIGNED" != "true" ]]; then
              echo "> This build is not notarized yet. On first launch, right-click Swapbar.app and choose **Open**."
              echo
            fi
            echo "SHA-256: \`$(cut -d' ' -f1 release-assets/Swapbar.dmg.sha256)\`"
            echo
            echo "Windows (Swapbar-windows-x64.zip) SHA-256: \`$(cut -d' ' -f1 release-assets/Swapbar-windows-x64.zip.sha256)\`"
          } > notes.md
          gh release create "$TAG" \
            --title "Swapbar $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}" \
            release-assets/Swapbar.dmg release-assets/Swapbar.dmg.sha256 \
            release-assets/Swapbar-windows-x64.zip release-assets/Swapbar-windows-x64.zip.sha256

  # Updates Casks/swapbar.rb in afatmustafa/homebrew-tap (`brew install --cask afatmustafa/tap/swapbar`).
  # Needs HOMEBREW_TAP_TOKEN: a fine-grained token with Contents read/write on that repository only.
  homebrew:
    needs: [build, publish]
    if: needs.build.outputs.dry_run == 'false' && !contains(needs.build.outputs.version, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew cask was not updated"
            exit 0
          fi
          sha=$(cut -d' ' -f1 release-assets/Swapbar.dmg.sha256)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/afatmustafa/homebrew-tap.git" tap
          mkdir -p tap/Casks
          ./scripts/cask.sh "$VERSION" "$sha" > tap/Casks/swapbar.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/swapbar.rb
          if git diff --cached --quiet; then
            echo "Cask already at $VERSION"
            exit 0
          fi
          git commit -m "swapbar $VERSION"
          git push
