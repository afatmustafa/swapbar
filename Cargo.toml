[package]
name = "swapbar"
version = "0.4.1"
edition = "2024"

[dependencies]
chrono = "0.4.45"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
cocoa = "0.26"
objc = "0.2"

# The same versions gpui uses on Windows, so nothing is built twice.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
resvg = { version = "0.45", default-features = false }
windows = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.5"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

# Measured on arm64: 6.6 MB → 3.0 MB with no measurable slowdown in the transcript scan.
# opt-level "z" saves another 0.6 MB but makes the scan ~2× slower.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
